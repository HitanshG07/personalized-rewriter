apiVersion: v1
kind: Namespace
metadata:
  name: ia-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rewriter
  namespace: ia-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rewriter
  template:
    metadata:
      labels:
        app: rewriter
    spec:
      containers:
        - name: rewriter
          image: sauravbanerjee28/personalized-rewriter:ia-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rewriter
  namespace: ia-demo
spec:
  selector:
    app: rewriter
  ports:
    - port: 8000
      targetPort: 8000