global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 15s
rule_files:
- /etc/prometheus/alert-rules.yml
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: rewriter
  metrics_path: /metrics
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - rewriter-ia2
    selectors:
    - role: pod
      label: app=rewriter
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_phase
    action: keep
    regex: Running
  - source_labels:
    - __meta_kubernetes_pod_container_name
    action: keep
    regex: rewriter
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    action: keep
    regex: http
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
