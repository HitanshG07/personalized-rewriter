groups:
- name: rewriter
  rules:
  - alert: RewriterPodDown
    expr: count(up{job="rewriter"} == 1) < 3
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: Fewer than 3 healthy rewriter pods
  - alert: RewriterHighErrorRate
    expr: 100 * sum(rate(requests_total{job="rewriter",status=~"5.."}[5m])) / clamp_min(sum(rate(requests_total{job="rewriter"}[5m])), 1e-9) > 10
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: More than 10 percent of responses are HTTP 5xx
  - alert: OpenRouterFailing
    expr: sum(increase(openrouter_failures_total{job="rewriter"}[10m])) > 5
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: OpenRouter calls are failing repeatedly
  - alert: RewriterSlowResponses
    expr: histogram_quantile(0.95, sum by (le) (rate(request_latency_seconds_bucket{job="rewriter"}[5m]))) > 5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: p95 response time is above 5 seconds
